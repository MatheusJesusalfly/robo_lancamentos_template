[project]
name = "robo-lancamentos-template"
version = "0.1.0"
description = "Robo que le a venda no Telegram e grava numa planilha"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pydantic-settings>=2.2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sem "-q" aqui de proposito: com ele, quem digitar "pytest -q" acaba com dois
# -q, e dois -q ESCONDEM a linha do resultado -- some justamente o "75 passed"
# que e a unica coisa que a pessoa precisa ler.
# --disable-warnings tira o muro amarelo de avisos de biblioteca, que nao e
# erro nenhum mas assusta quem nao le codigo.
addopts = "--disable-warnings --tb=short"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
